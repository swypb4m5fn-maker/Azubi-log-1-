<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Ausbildungs-Notiz-App</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>📘 Ausbildungs-Notiz-App</h1><p>Dein digitales Ausbildungs-Tagebuch</p></header>
<main>
<section class="hero"><h2>Was hast du heute gemacht?</h2><button id="voiceButton" class="voice">🎤 Eintrag sprechen</button><button id="manualButton" class="secondary">✍️ Manuell eintragen</button></section>
<section class="tools"><h2>Meine Einträge</h2><div class="search-row"><input id="searchInput" type="search" placeholder="🔎 Einträge durchsuchen"><button id="clearSearch" type="button">Zurücksetzen</button></div><select id="categoryFilter"><option value="">Alle Kategorien</option><option>Praxis</option><option>Berufsschule</option><option>Software</option><option>Werkzeuge</option><option>Kundenkontakt</option><option>Gelernt</option><option>Fragen</option><option>Wichtig</option></select><div class="count" id="entryCount">0 Einträge</div></section>
<section class="calendar-section"><div class="section-head"><h2>📅 Kalender</h2><button id="todayButton" class="small-button">Heute</button></div><div class="calendar-head"><button id="prevMonth" class="calendar-nav">‹</button><strong id="monthTitle"></strong><button id="nextMonth" class="calendar-nav">›</button></div><div id="calendar" class="calendar"></div><div id="selectedDateLabel" class="selected-date"></div></section>
<section><div id="entriesList"></div></section>
</main>
<nav class="bottom"><button type="button" data-nav="home">🏠<span>Start</span></button><button type="button" data-nav="calendar">📅<span>Kalender</span></button><button type="button" data-nav="search">🔎<span>Suche</span></button><button type="button" data-nav="more">☰<span>Mehr</span></button></nav>
<div id="entryModal" class="modal hidden"><div class="modal-box"><button id="closeModal" class="close" type="button">×</button><h2>Neuer Eintrag</h2><form id="entryForm"><label>Titel<input id="title" maxlength="80" placeholder="z. B. Kundenauftrag bearbeitet"></label><label>Beschreibung<textarea id="description" rows="5" placeholder="Was hast du gemacht?"></textarea></label><label>Gelernt / Erkenntnis<textarea id="learned" rows="3" placeholder="Was hast du dabei gelernt?"></textarea></label><div class="two"><label>Datum<input id="today" type="date"></label><label>Kategorie<select id="category"><option>Praxis</option><option>Berufsschule</option><option>Software</option><option>Werkzeuge</option><option>Kundenkontakt</option><option>Gelernt</option><option>Fragen</option><option>Wichtig</option></select></label></div><label class="check"><input id="important" type="checkbox"> ⭐ Als wichtig markieren</label><div class="form-actions"><button type="button" id="cancelButton" class="secondary">Abbrechen</button><button type="submit" class="primary">💾 Speichern</button></div></form></div></div>
<div id="confirmModal" class="modal hidden"><div class="confirm-box"><h2>Eintrag löschen?</h2><p>Der Eintrag wird dauerhaft von diesem Gerät entfernt.</p><div class="form-actions"><button id="cancelDelete" class="secondary" type="button">Abbrechen</button><button id="confirmDelete" class="danger" type="button">🗑️ Löschen</button></div></div></div>
<script src="app.js"></script></body></html>
